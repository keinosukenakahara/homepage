/* 固定予約ボタン */
.fixed-reserve {
    position: fixed;
    bottom: 10px;

    padding: 16px;
    text-align: center;

/* モーダル */
.modal {

    height: 100%;

.modal-content {
    background: #fff;

form input,

form button{

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxMcX4qUGI2SLx7jIYsW1anY2K7wSgqr3DayOnhmj8CMIT0IbE7cyo22NQBQEha84Y/exec";

let calendarData = [];

document.getElementById("seats").textContent =
Math.floor(Math.random() * 5) + 1;

const modal = document.getElementById("modal");
const title = document.getElementById("menu-title");
const detail = document.getElementById("menu-detail");

const data = {
sashimi: {title:"刺身盛り",detail:"厳選鮮魚",price:"1280円"},
salad: {title:"豆腐サラダ",detail:"自家製",price:"680円"},
yakitori: {title:"焼き鳥",detail:"炭火",price:"980円"},
sake: {title:"日本酒",detail:"地酒",price:"600円〜"},
whisky: {title:"ウイスキー",detail:"国産中心",price:"700円〜"},
beer: {title:"生ビール",detail:"キリン",price:"550円"}
};

document.querySelectorAll(".menu-item img").forEach(img=>{
img.onclick=()=>{
let d=data[img.id];
title.textContent=d.title;
detail.innerHTML=d.detail+"<br><strong>"+d.price+"</strong>";
modal.style.display="block";
};
});


async function loadCalendar(){

    try{

        const response =
        await fetch(API_URL);

        calendarData =
        await response.json();

        console.log(calendarData);

    }catch(error){

        console.error(error);

        alert("営業データ取得失敗");

    }

}

window.addEventListener("load", async ()=>{

    await loadCalendar();

    /* Flatpickr生成 */

    flatpickr("#reservationDate", {

        dateFormat: "Y-m-d",

        minDate: "today",

        disable: [

            function(date){

                return false;

            }

        ],

        onDayCreate: function(dObj, dStr, fp, dayElem){

            const date =
            dayElem.dateObj;

            const yyyy =
            date.getFullYear();

            const mm =
            String(date.getMonth()+1)
            .padStart(2,"0");

            const dd =
            String(date.getDate())
            .padStart(2,"0");

            const formatted =
            `${yyyy}-${mm}-${dd}`;

            const dayData =
            calendarData.find(d => {

                const sheet =
                new Date(d.date);

                const sy =
                sheet.getFullYear();

                const sm =
                String(sheet.getMonth()+1)
                .padStart(2,"0");

                const sd =
                String(sheet.getDate())
                .padStart(2,"0");

                return `${sy}-${sm}-${sd}`
                === formatted;

            });

            if(!dayData) return;

            /* 休業日 */

            if(dayData.open == false){

                dayElem.classList
                .add("closed-day");

            }

            /* 満席 */

            if(dayData.status == "full"){

                dayElem.classList
                .add("full-day");

            }

        }

    });

});

document.getElementById("close").onclick=()=>modal.style.display="none";
window.onclick=e=>{


	if(e.target==modal){
	modal.style.display="none";
	}

	if(e.target==reservationModal){

	reservationModal.style.display="none";

	/* 固定ボタン再表示 */

	document.querySelector(".fixed-reserve")
	.style.display="block";

	}

};





/* 予約モーダル */

const reservationModal =
document.getElementById("reservationModal");

function openReservation(){

	reservationModal.style.display="block";

	/* 固定ボタン非表示 */

	document.querySelector(".fixed-reserve")
	.style.display="none";

}

document.getElementById("reservationClose").onclick=()=>{

	reservationModal.style.display="none";

	/* 固定ボタン再表示 */

	document.querySelector(".fixed-reserve")
	.style.display="block";

};

/* 営業時間制限 */

const reservationDate =
document.getElementById("reservationDate");






reservationDate.addEventListener("change", function(){

    const selectedDate = this.value;

    if(!selectedDate) return;

    const selected =
    new Date(selectedDate);

    const day =
    selected.getDay();


    /* スプレッド検索 */

    console.log("selectedDate", selectedDate);
    console.log("calendarData", calendarData);

    const dayData =

    calendarData.find(d => {

    const sheetDate =
    new Date(d.date);

    const yyyy =
    sheetDate.getFullYear();

    const mm =
    String(sheetDate.getMonth()+1)
    .padStart(2,"0");

    const dd =
    String(sheetDate.getDate())
    .padStart(2,"0");

    const formatted =
    `${yyyy}-${mm}-${dd}`;

    return formatted === selectedDate;

    });

    console.log("dayData", dayData);

    if(!dayData){

        alert("営業情報がありません");

        this.value = "";

        return;
    }

    /* 店休日 */

    if(dayData.open == false){

        alert("休業日です");

        this.value = "";

        return;
    }

    /* 満席 */

    if(dayData.status == "full"){

        alert("満席です");

        this.value = "";

        return;
    }

    /* 営業時間生成 */

    createTimeOptions(
        dayData.start,
        dayData.end
    );

});











/* 過去日禁止 */

const today = new Date();

today.setMinutes(
today.getMinutes() - today.getTimezoneOffset()
);

document.getElementById("reservationDate").min =
today.toISOString().split("T")[0];

/* submit時 */

document.querySelector("form")
.addEventListener("submit",function(e){

const date =
document.getElementById("reservationDate").value;

const start =
document.getElementById("startHour").value;

const end =
document.getElementById("endHour").value;

/* 未選択 */

if(!date || !start || !end){

alert("予約日時を選択してください");

e.preventDefault();

return;

}

/* 開始・終了チェック */

if(start >= end){

alert("終了時間は開始時間より後にしてください");

e.preventDefault();

return;

}

/* hiddenへ格納 */

document.getElementById("datetime").value =
`${date} ${start} ～ ${end}`;

/* 日曜チェック */

const selected = new Date(date);


});




function createTimeOptions(start, end){

    const startSelect =
    document.getElementById("startHour");

    const endSelect =
    document.getElementById("endHour");

    startSelect.innerHTML =
    '<option value="">開始時間</option>';

    endSelect.innerHTML =
    '<option value="">終了時間</option>';

    /* 文字列化 */

    start = String(start).substring(0,5);
    end = String(end).substring(0,5);

    console.log(start, end);

    let startHour =
    parseInt(start.split(":")[0]);

    let endHour =
    parseInt(end.split(":")[0]);

    /* 24:00対策 */

    if(endHour === 24){
        endHour = 23;
    }

    for(let h = startHour; h <= endHour; h++){

        for(let m of ["00","30"]){

            /* 23:30で終了 */

            if(h === 23 && m === "30"){
                continue;
            }

            const time =
            `${String(h).padStart(2,"0")}:${m}`;

            const startOption =
            document.createElement("option");

            startOption.value = time;
            startOption.textContent = time;

            startSelect.appendChild(startOption);

            const endOption =
            document.createElement("option");

            endOption.value = time;
            endOption.textContent = time;

            endSelect.appendChild(endOption);

        }

    }

}







/* 日時表示更新 */

function updateDateTimeDisplay(){

const date =
document.getElementById("reservationDate").value;

const start =
document.getElementById("startHour").value;

const end =
document.getElementById("endHour").value;

if(date && start && end){

const datetimeValue =
`${date} ${start} ～ ${end}`;

document.getElementById("datetime").value =
datetimeValue;

document.getElementById("datetimeDisplay").value =
datetimeValue;

}

}



/* イベント */

document.getElementById("reservationDate")
.addEventListener("change", updateDateTimeDisplay);

document.getElementById("startHour")
.addEventListener("change", updateDateTimeDisplay);

document.getElementById("endHour")
.addEventListener("change", updateDateTimeDisplay);





</script>
